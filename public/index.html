<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auth API</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">auth</span>
      </div>
      <span id="api-status" class="status-pill" aria-live="polite">
        <span class="status-dot" aria-hidden="true"></span>
        <span id="api-status-text">Verificando API</span>
      </span>
    </header>

    <!-- Visão não autenticada: Login / Cadastro -->
    <section id="auth-view" class="panel" aria-label="Autenticação">
      <div class="tabs" role="tablist" aria-label="Modo de autenticação">
        <button
          id="tab-login"
          class="tab is-active"
          type="button"
          role="tab"
          aria-selected="true"
          aria-controls="panel-login"
        >
          Entrar
        </button>
        <button
          id="tab-register"
          class="tab"
          type="button"
          role="tab"
          aria-selected="false"
          aria-controls="panel-register"
        >
          Criar conta
        </button>
      </div>

      <div id="auth-feedback" class="feedback" role="status" aria-live="polite" hidden></div>

      <!-- Formulário de Login -->
      <form id="panel-login" class="form" role="tabpanel" aria-labelledby="tab-login" novalidate>
        <div class="field">
          <label for="login-email">E-mail</label>
          <input
            id="login-email"
            name="email"
            type="email"
            autocomplete="email"
            placeholder="nome@exemplo.com"
            required
          >
        </div>

        <div class="field">
          <label for="login-password">Senha</label>
          <input
            id="login-password"
            name="password"
            type="password"
            autocomplete="current-password"
            placeholder="Sua senha"
            required
          >
        </div>

        <button id="login-submit" class="btn btn-primary" type="submit">
          Entrar
        </button>
      </form>

      <!-- Formulário de Cadastro -->
      <form id="panel-register" class="form" role="tabpanel" aria-labelledby="tab-register" hidden novalidate>
        <div class="field">
          <label for="register-name">Nome</label>
          <input
            id="register-name"
            name="name"
            type="text"
            autocomplete="name"
            placeholder="Seu nome"
            minlength="2"
            required
          >
        </div>

        <div class="field">
          <label for="register-email">E-mail</label>
          <input
            id="register-email"
            name="email"
            type="email"
            autocomplete="email"
            placeholder="nome@exemplo.com"
            required
          >
        </div>

        <div class="field">
          <label for="register-password">Senha</label>
          <input
            id="register-password"
            name="password"
            type="password"
            autocomplete="new-password"
            placeholder="Mínimo de 6 caracteres"
            minlength="6"
            required
          >
        </div>

        <button id="register-submit" class="btn btn-primary" type="submit">
          Criar conta
        </button>
      </form>
    </section>

    <!-- Visão autenticada: Perfil / Sessão -->
    <section id="session-view" class="panel" aria-label="Sessão autenticada" hidden>
      <div class="profile-header">
        <div id="user-avatar" class="avatar" aria-hidden="true"></div>
        <div class="profile-identity">
          <h1 id="user-name" class="profile-name"></h1>
          <p id="user-email" class="profile-email"></p>
        </div>
        <span class="badge-auth">Autenticado</span>
      </div>

      <div id="session-feedback" class="feedback" role="status" aria-live="polite" hidden></div>

      <dl class="meta-list">
        <div class="meta-row">
          <dt>ID</dt>
          <dd id="user-id" class="mono"></dd>
        </div>
        <div class="meta-row">
          <dt>Criado em</dt>
          <dd id="user-created" class="mono"></dd>
        </div>
        <div class="meta-row">
          <dt>Endpoint</dt>
          <dd class="mono">GET /auth/me</dd>
        </div>
      </dl>

      <details class="token-details">
        <summary>Token JWT</summary>
        <div class="token-body">
          <code id="token-value" class="token-code"></code>
          <button id="copy-token-btn" class="btn btn-ghost btn-sm" type="button">
            Copiar token
          </button>
        </div>
      </details>

      <div class="session-actions">
        <button id="refresh-profile-btn" class="btn btn-secondary" type="button">
          Validar sessão
        </button>
        <button id="logout-btn" class="btn btn-danger" type="button">
          Sair
        </button>
      </div>
    </section>

    <footer class="footer">
      <span>Node.js · Express · JWT · SQLite</span>
    </footer>
  </main>

  <script src="/app.js" defer></script>
</body>
</html>
